server:
  port: ${PORT:8080}

spring:
  application:
    name: strangerchat-backend
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:strangerchat}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:1234}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours for registered users
    guest-expiration-ms: 7200000 # 2 hours for guests
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  rate-limit:
    auth-capacity: 10
    auth-refill-tokens: 10
    auth-refill-period-seconds: 60
    message-capacity: 10
    message-refill-tokens: 10
    message-refill-period-seconds: 2

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
