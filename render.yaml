services:
  # Spring Boot Backend Web Service
  - type: web
    name: strangerchat-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: strangerchat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

# Managed PostgreSQL Database on Render
databases:
  - name: strangerchat-db
    databaseName: strangerchat
    user: strangerchat_user
    plan: free

